services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: chat-analytics-dynamodb
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - chat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-analytics-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - DYNAMODB_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - LOG_LEVEL=info
      # Voice Ops Briefings. Off by default; set BRIEFING_ENABLED=true and
      # supply credentials (via a .env file, not this checked-in config).
      - BRIEFING_ENABLED=${BRIEFING_ENABLED:-false}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      - BRIEFING_MONTHLY_CHAR_BUDGET=${BRIEFING_MONTHLY_CHAR_BUDGET:-10000}
      - BRIEFING_AUDIO_DIR=/data/briefings
    volumes:
      # Synthesized mp3s are the content-hash cache. On an ephemeral filesystem
      # every restart re-synthesizes the same briefings and re-bills for them.
      - briefing-audio:/data/briefings
    depends_on:
      dynamodb:
        condition: service_started
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: ws://localhost:8080/ws
        VITE_API_URL: http://localhost:8080
    container_name: chat-analytics-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge

volumes:
  briefing-audio:
